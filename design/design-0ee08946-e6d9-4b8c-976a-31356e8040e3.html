    <script vid="144">
        
        const btnOpen = document.getElementById('btn-open-settings');
        const btnClose = document.getElementById('btn-close-settings');
        const btnCancel = document.getElementById('btn-cancel-settings');
        const btnSave = document.getElementById('btn-save-settings');
        const modal = document.getElementById('settings-dialog');
        const backdrop = document.getElementById('modal-backdrop');

        function openSettings() {
            backdrop.classList.remove('opacity-0', 'pointer-events-none');
            backdrop.classList.add('opacity-100', 'pointer-events-auto');
            
            modal.classList.remove('opacity-0', 'pointer-events-none', 'scale-[0.95]');
            modal.classList.add('opacity-100', 'pointer-events-auto', 'scale-100');
        }

        function closeSettings() {
            backdrop.classList.remove('opacity-100', 'pointer-events-auto');
            backdrop.classList.add('opacity-0', 'pointer-events-none');
            
            modal.classList.remove('opacity-100', 'pointer-events-auto', 'scale-100');
            modal.classList.add('opacity-0', 'pointer-events-none', 'scale-[0.95]');
        }

        btnOpen.addEventListener('click', openSettings);
        btnClose.addEventListener('click', closeSettings);
        btnCancel.addEventListener('click', closeSettings);
        btnSave.addEventListener('click', closeSettings);

        
        function updatePreview() {
            const container = document.getElementById('shortcut-preview-container');
            container.innerHTML = ''; 

            const mods = [
                { id: 'chk-ctrl', label: 'Ctrl' },
                { id: 'chk-alt', label: 'Alt' },
                { id: 'chk-shift', label: 'Shift' },
                { id: 'chk-win', label: 'Win' }
            ];

            const activeKeys = [];

            mods.forEach(mod => {
                if (document.getElementById(mod.id).checked) {
                    activeKeys.push(mod.label);
                }
            });

            const mainKey = document.getElementById('sel-key').value;
            if (mainKey) {
                activeKeys.push(mainKey);
            }

            if (activeKeys.length === 0) {
                container.innerHTML = '<span class="text-[12px] text-gray-400 italic">None selected</span>';
                return;
            }

            activeKeys.forEach((key, index) => {
                
                const kbd = document.createElement('kbd');
                kbd.className = 'kbd-key px-2.5 py-1 bg-white border border-gray-200 rounded-[4px] text-[12px] font-semibold text-gray-700 min-w-[24px] text-center transition-all duration-200';
                kbd.textContent = key;
                container.appendChild(kbd);

                
                if (index < activeKeys.length - 1) {
                    const plus = document.createElement('span');
                    plus.className = 'text-gray-400 text-[14px] font-medium mx-0.5';
                    plus.textContent = '+';
                    container.appendChild(plus);
                }
            });
        }

        
        updatePreview();
    </script>

</body></html>

<!doctype html>
<html><head><meta charset="utf-8"><title>DockPad — Secret injection</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .ex-bar { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); font-size: 15px; color: var(--text-subtle); }
  .ex-bar b { color: var(--text); font-weight: 600; }
  .ex-h { display: flex; padding: 10px 20px 6px; font-size: 13px; color: var(--text-hint); border-bottom: 1px solid var(--separator); }
  .ex-r { height: 46px; display: flex; align-items: center; gap: 14px; padding: 0 20px; font-size: 16px; color: var(--text); }
  .ex-r .c2 { margin-left: auto; width: 170px; color: var(--text-hint); font-size: 14px; }
  .ex-r img, .ex-r svg { width: 24px; height: 24px; }
  .ex-r.sel { background: var(--accent-tint); }
  .code { position: absolute; inset: 0; background: var(--surface-card); padding: 22px 26px; font-size: 18px; line-height: 34px; color: var(--text-secondary); white-space: pre; }
  .code .k { color: #0B7A75; } .code .c { color: var(--text-faint); }
  :root[data-theme="dark"] .code .k { color: #4EC9B0; }
  .mk { display: inline-flex; vertical-align: bottom; }
  .mk > span { display: inline-block; overflow: hidden; white-space: nowrap; }
  .mk .raw { color: #B26A00; background: color-mix(in srgb, #FFB900 18%, transparent); border-radius: 4px; padding: 0 4px; }
  :root[data-theme="dark"] .mk .raw { color: #FFC46B; }
  .mk .dots { color: #1E7D34; background: color-mix(in srgb, #34A853 20%, transparent); border-radius: 4px; padding: 0 6px; }
  :root[data-theme="dark"] .mk .dots { color: #6FD68A; }

  .dlg-wrap { position: absolute; left: 1010px; top: 190px; transform: scale(1.45); transform-origin: 0 0; }
  .dlg { width: 520px; height: 330px; background: var(--surface); border-radius: 8px; overflow: hidden; box-shadow: var(--window-shadow); border: 1px solid var(--border); position: relative; color: var(--text); }
  .dlg-h { background: var(--accent); color: #fff; padding: 12px 20px 12px; height: 66px; }
  .dlg-h .t { font-size: 16px; font-weight: 600; } .dlg-h .f { font-size: 11.5px; margin-top: 4px; opacity: .9; }
  .dlg-b { position: absolute; left: 0; right: 0; top: 66px; bottom: 64px; padding: 20px 24px; font-size: 13px; }
  .dlg-f { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--surface-card); border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px; padding: 0 20px; }
  .dlg-f .v { font-size: 11px; color: var(--text-faint); margin-right: auto; }
  .btn { height: 32px; padding: 0 16px; border-radius: 4px; display: inline-flex; align-items: center; font-size: 13px; }
  .btn.p { background: var(--accent); color: #fff; } .btn.s { background: var(--surface-muted); color: var(--text); border: 1px solid var(--border-strong); }
  .pw { height: 32px; margin-top: 8px; border: 1px solid var(--border-strong); background: var(--surface-card); border-radius: 3px; padding: 0 10px;
    display: flex; align-items: center; font-size: 16px; letter-spacing: 3px; color: var(--text); }
  .pw.focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .chk { display: flex; gap: 8px; margin-top: 18px; align-items: flex-start; }
  .chk .box { width: 16px; height: 16px; border-radius: 3px; background: var(--accent); color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; flex: none; margin-top: 1px; }
  .hint { color: var(--text-detail); font-size: 11.5px; margin-top: 3px; line-height: 15px; }
  .prog { height: 4px; border-radius: 2px; background: var(--gauge-track); overflow: hidden; margin-top: 14px; position: relative; }
  .prog i { position: absolute; top: 0; bottom: 0; width: 30%; background: var(--accent); border-radius: 2px; }
  .ok { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; color: #1E7D34; }
  :root[data-theme="dark"] .ok { color: #6FD68A; }
  .ok .dot { width: 18px; height: 18px; border-radius: 50%; background: #34A853; color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; }
  .ring { width: 54px; height: 54px; position: relative; flex: none; }
  .ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: var(--accent); }
  .clip { display: flex; gap: 14px; align-items: center; margin-top: 18px; padding: 12px 14px; background: var(--surface-card); border: 1px solid var(--border); border-radius: 6px; }
</style></head>
<body><div id="stage"></div>
<script type="module">
import { clip, prog, env, E, style, el, lerp } from '../shared/engine.js';
import { stage, icon, cursor, renderCursor, legend, appWindow, centerOf, renderPop } from '../shared/ui.js';

const DOC = `<svg viewBox="0 0 24 24"><path d="M6 2h8l5 5v15H6z" fill="var(--surface-card)" stroke="var(--text-hint)" stroke-width="1.3"/><path d="M14 2v5h5" fill="none" stroke="var(--text-hint)" stroke-width="1.3"/><path d="M9 12h7M9 15h7M9 18h5" stroke="#0078D4" stroke-width="1.3"/></svg>`;
const MARKERS = ['db-password', 'smtp-password', 'api-token'];
const MORPH = [4.15, 4.55, 4.95];

clip({
  duration: 10,
  async build() {
    const { st, camera } = stage();
    const files = [['folder', 'templates', 'File folder'], [null, 'docker-compose.yml', 'YAML file'], [null, '.env.example', 'EXAMPLE file'], [null, 'README.md', 'Markdown file']];
    const explorer = appWindow(camera, { w: 820, h: 620, icon: 'explorer', title: 'vaultwarden', body: `
      <div class="ex-bar">Infra <span>›</span> <b>vaultwarden</b></div>
      <div class="ex-h"><span style="padding-left:38px">Name</span><span style="margin-left:auto;width:170px">Type</span></div>
      ${files.map(([ic, n, ty], i) => `<div class="ex-r" data-i="${i}">${ic ? `<img src="${icon(ic)}">` : DOC}<span>${n}</span><span class="c2">${ty}</span></div>`).join('')}` });
    style(explorer, { left: '120px', top: '180px' });

    const mk = n => `<span class="mk"><span class="raw">{{ bw:app-infra:${n} }}</span><span class="dots">••••••••••</span></span>`;
    const preview = appWindow(camera, { w: 820, h: 620, icon: 'notepad', title: 'docker-compose.yml', body: `<div class="code mono"><span class="k">services</span>:
  <span class="k">app</span>:
    <span class="k">image</span>: ghcr.io/acme/app:latest
    <span class="k">environment</span>:
      <span class="k">DB_PASSWORD</span>: ${mk(MARKERS[0])}
      <span class="k">SMTP_PASSWORD</span>: ${mk(MARKERS[1])}
      <span class="k">API_TOKEN</span>: ${mk(MARKERS[2])}
      <span class="k">DOMAIN</span>: https://vault.example.com
    <span class="c"># the markers come from Vaultwarden at render time</span></div>` });
    style(preview, { left: '120px', top: '180px' });

    const menu = el(`<div class="cmenu" style="left:0;top:0;min-width:250px;font-size:15px">
      <div class="it"><span class="g"></span>Open</div><div class="it"><span class="g"></span>Open with</div>
      <div class="it"><span class="g"></span>Copy as path</div><div class="sepr"></div>
      <div class="it inj"><span class="g sym">🔑</span>Inject secrets…</div></div>`);
    camera.appendChild(menu);

    const dlg = el(`<div class="dlg-wrap"><div class="dlg">
      <div class="dlg-h"><div class="t">Secret injection</div><div class="f mono">docker-compose.yml</div></div>
      <div class="dlg-b s-unlock">
        <div>Master password</div><div class="pw"></div>
        <div class="chk"><span class="box">✓</span><div>Refresh the vault before injecting<div class="hint">The CLI reads a local cache: without this, an item you just changed in the vault is not visible yet.</div></div></div>
      </div>
      <div class="dlg-b s-work"><div style="font-weight:600;font-size:14px">Refreshing the vault, then reading it…</div>
        <div class="hint" style="margin-top:6px">Vault synchronisation</div><div class="prog"><i></i></div>
        <div class="hint w-count" style="margin-top:16px"></div></div>
      <div class="dlg-b s-done"><div class="ok"><span class="dot">✓</span>Render complete</div>
        <div class="hint" style="margin-top:6px;font-size:12.5px">3 markers resolved</div>
        <div class="clip"><div class="ring"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="23" fill="none" stroke="var(--gauge-track)" stroke-width="4"/><circle class="arc" cx="27" cy="27" r="23" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round" stroke-dasharray="144.5" stroke-dashoffset="0"/></svg><span></span></div>
          <div><div style="font-weight:600">The rendered file is in the clipboard.</div><div class="hint cd"></div></div></div>
      </div>
      <div class="dlg-f"><span class="v mono">v1.25.2</span><span class="btn p unlock">Unlock</span><span class="btn s">Cancel</span></div>
    </div></div>`);
    camera.appendChild(dlg);
    const row = centerOf(explorer.querySelector('[data-i="1"]'));
    style(menu, { left: `${row.l + 260}px`, top: `${row.y + 4}px` });
    const inj = centerOf(menu.querySelector('.inj'));
    const unlock = centerOf(dlg.querySelector('.unlock'));
    const pw = centerOf(dlg.querySelector('.pw'));
    // Largeurs naturelles, pour que le marqueur se replie pendant que les points se deplient.
    const widths = [...preview.querySelectorAll('.mk')].map(m => [m.querySelector('.raw').scrollWidth, m.querySelector('.dots').scrollWidth]);
    const cur = cursor(camera);
    return { st, widths, explorer, preview, menu, dlg, row, inj, unlock, pw, cur, leg: legend(st) };
  },

  render(t, x) {
    // Explorateur -> apercu du fichier, puis retour pour boucler.
    const toPreview = prog(t, 1.7, 2.05) * (1 - prog(t, 9.3, 9.75));
    style(x.explorer, { opacity: 1 - toPreview, visibility: toPreview < 1 ? 'visible' : 'hidden' });
    style(x.preview, { opacity: toPreview, visibility: toPreview > 0 ? 'visible' : 'hidden' });
    x.explorer.querySelector('[data-i="1"]').classList.toggle('sel', t >= .95 && t < 2.1);

    // Menu contextuel : clic droit, survol de l'entree, clic.
    renderPop(x.menu, t, [1.0, 1.15], [1.6, 1.7], .94);
    x.menu.querySelector('.inj').classList.toggle('sel', t >= 1.4);

    // Marqueurs remplaces un a un pendant la lecture — jamais une valeur, des points.
    x.preview.querySelectorAll('.mk').forEach((m, i) => {
      const p = prog(t, MORPH[i], MORPH[i] + .25, E.out) * (1 - prog(t, 9.3, 9.75));
      const [wr, wd] = x.widths[i];
      style(m.querySelector('.raw'), { opacity: 1 - p, maxWidth: `${wr * (1 - p)}px`, paddingLeft: p > .99 ? '0' : '', paddingRight: p > .99 ? '0' : '' });
      style(m.querySelector('.dots'), { opacity: p, maxWidth: `${wd * p}px`, paddingLeft: p < .01 ? '0' : '', paddingRight: p < .01 ? '0' : '' });
    });

    // Fenetre d'injection : saisie, travail, compte-rendu.
    renderPop(x.dlg.firstChild, t, [1.8, 2.1], [9.2, 9.45]);
    const stateName = t < 3.7 ? 'unlock' : t < 5.35 ? 'work' : 'done';
    ['unlock', 'work', 'done'].forEach(s => x.dlg.querySelector(`.s-${s}`).style.display = s === stateName ? 'block' : 'none');
    const dots = Math.floor(clamp01((t - 2.3) / .9) * 12);
    x.dlg.querySelector('.pw').textContent = '•'.repeat(dots);
    x.dlg.querySelector('.pw').classList.toggle('focus', t >= 2.2 && t < 3.7);
    const f = x.dlg.querySelector('.dlg-f');
    f.querySelector('.unlock').style.display = stateName === 'unlock' ? 'inline-flex' : 'none';
    f.querySelector('.s').textContent = stateName === 'unlock' ? 'Cancel' : 'Close';
    x.dlg.querySelector('.prog i').style.left = `${((t * 1.2) % 1.3) * 100 - 30}%`;
    x.dlg.querySelector('.w-count').textContent = `${MORPH.filter(m => t >= m).length} / 3 markers resolved`;
    const secs = 90 - Math.max(0, t - 5.35);
    x.dlg.querySelector('.ring span').textContent = `${Math.ceil(secs)}`;
    x.dlg.querySelector('.cd').textContent = `Clearing in ${Math.ceil(secs)} s`;
    x.dlg.querySelector('.arc').setAttribute('stroke-dashoffset', `${144.5 * (1 - secs / 90)}`);
    const pop = env(t, 5.35, 5.7, .15);
    x.dlg.querySelector('.clip').style.transform = `scale(${1 + pop * .03})`;

    renderCursor(x.cur, t, [
      [.2, 1600, 960], [.8, x.row.x - 150, x.row.y], [1.2, x.row.x - 150, x.row.y],
      [1.45, x.inj.x - 40, x.inj.y], [2.2, x.inj.x - 40, x.inj.y], [2.5, x.pw.x + 120, x.pw.y + 6],
      [3.2, x.pw.x + 120, x.pw.y + 6], [3.55, x.unlock.x, x.unlock.y], [4.4, x.unlock.x, x.unlock.y], [5.2, 1600, 960],
    ], [.95, 1.6, 2.2, 3.65], [.2, 5.3]);

    x.leg(t, [[.35, 5.05, 'Right-click any file → Inject secrets'], [5.35, 9.5, 'Straight to the clipboard, never on disk']]);
  },
});
const clamp01 = v => Math.max(0, Math.min(1, v));
</script></body></html>

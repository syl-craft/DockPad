<!doctype html>
<html><head><meta charset="utf-8"><title>DockPad — Keyboard overlay</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>
  .ex-body { position: absolute; inset: 0; background: var(--surface-card); display: flex; }
  .ex-side { width: 220px; background: var(--surface); border-right: 1px solid var(--border); padding: 18px; display: flex; flex-direction: column; gap: 14px; font-size: 16px; color: var(--text-subtle); }
  .ex-grid { flex: 1; padding: 24px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; align-content: start; }
  .ex-grid div { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 14px; color: var(--text); }
  .ex-grid img { width: 64px; height: 64px; }
</style></head>
<body><div id="stage"></div>
<script type="module">
import { clip, prog, env, E, style, el } from '../shared/engine.js';
import { stage, buildDock, placeDock, showPage, renderUsage, tileXY, tileState, resetTiles, GRID, legend, keycaps,
  appWindow, renderLaunch, TERMINAL_BODY } from '../shared/ui.js';

const S = 1.25, DX = (1920 - 850 * 1.25) / 2, DY = 64;
const LEFT = [.75, 2.55], RIGHT = [3.2, 5.0];
const HIT1 = 1.55, HIT2 = 3.95;
const PAGES = [[5.7, 6.1, 0, 1], [6.55, 6.95, 1, 2], [7.45, 7.85, 2, 1], [8.2, 8.6, 1, 0]];

clip({
  duration: 10,
  async build() {
    const { st, camera } = stage();
    const dock = buildDock(camera, { usage: 'single' });
    placeDock(dock, DX, DY, S);
    renderUsage(dock.usage, 'claude');
    // Grille superposee aux tuiles, comme TileHintOverlay : un voile et un badge par case.
    const hints = el('<div class="abs" style="left:0;top:0"></div>');
    dock.root.appendChild(hints);
    const cells = [];
    for (let r = 0; r < 4; r++) for (let c = 0; c < 6; c++) {
      const label = r < 3 ? String(r * 3 + (c % 3) + 1) : ['0', '↑', '↓'][c % 3];
      const p = tileXY(r, c);
      const n = el(`<div class="hint-cell" style="left:${p.x}px;top:${p.y}px"><b>${label}</b></div>`);
      hints.appendChild(n);
      cells.push({ n, r, c });
    }
    const apps = el('<div class="layer"></div>');
    camera.appendChild(apps);
    const term = appWindow(apps, { w: 1000, h: 600, icon: 'terminal', title: 'Terminal', body: TERMINAL_BODY(['PS C:\\dev&gt; <span style="background:#ccc;color:#000">&nbsp;</span>']) });
    const explorer = appWindow(apps, { w: 1000, h: 600, icon: 'explorer', title: 'File Explorer', body: `<div class="ex-body">
      <div class="ex-side"><span>Home</span><span>Desktop</span><span>Documents</span><span>Downloads</span></div>
      <div class="ex-grid">${['dev', 'Projects', '3D Prints', 'Documents', 'Downloads', 'Music', 'Pictures', 'Videos'].map(n => `<div><img src="/icons/folder.png">${n}</div>`).join('')}</div></div>` });
    return { st, camera, dock, cells, term, explorer, leg: legend(st), keys: keycaps(st) };
  },

  render(t, x) {
    const { dock } = x;
    const show = prog(t, 0, .4, E.out) * (1 - prog(t, 9.45, 9.9, E.in));
    placeDock(dock, DX, DY, S, { opacity: show, scale: .96 + .04 * show });

    // Pages : → → ← ←, sans bouclage aux extremites.
    let pos = 0;
    for (const [a, b, from, to] of PAGES) if (t >= a) pos = from + (to - from) * prog(t, a, b);
    showPage(dock, pos);

    // Overlay : Ctrl -> moitie gauche, Shift -> moitie droite ; masque au lancement.
    const left = t >= LEFT[0] && t < HIT1 + .1, right = t >= RIGHT[0] && t < HIT2 + .1;
    x.cells.forEach(({ n, c }) => {
      const on = (left && c < 3) || (right && c >= 3);
      n.style.opacity = on ? 1 : 0;
    });

    resetTiles(dock);
    const flash1 = env(t, HIT1, HIT1 + .3, .08), flash2 = env(t, HIT2, HIT2 + .3, .08);
    tileState(dock.tiles[0]['0:2'], 0, 0, flash1);
    tileState(dock.tiles[0]['1:5'], 0, 0, flash2);

    const target = { x: 460, y: 200, w: 1000, h: 600 };
    const rect = (r, c) => { const p = tileXY(r, c); return { x: dock.x + p.x * S, y: dock.y + p.y * S, w: GRID.w * S, h: GRID.h * S }; };
    renderLaunch(x.term, t, rect(0, 2), target, [HIT1 + .12, HIT1 + .5], [2.55, 2.85]);
    renderLaunch(x.explorer, t, rect(1, 5), target, [HIT2 + .12, HIT2 + .5], [4.95, 5.25]);

    x.keys(t, [
      { label: 'Ctrl', a: .6, b: 2.7, down: [LEFT], accent: true },
      { label: '3', a: 1.3, b: 2.7, down: [[HIT1, HIT1 + .14]] },
      { label: 'Shift', a: 3.05, b: 5.15, down: [RIGHT], accent: true },
      { label: '6', a: 3.7, b: 5.15, down: [[HIT2, HIT2 + .14]] },
      { label: '→', a: 5.45, b: 7.2, down: [[5.7, 5.84], [6.55, 6.69]] },
      { label: '←', a: 7.2, b: 8.95, down: [[7.45, 7.59], [8.2, 8.34]] },
    ]);
    x.leg(t, [[.5, 5.3, 'Hold Ctrl or Shift, press a number'], [5.5, 9.4, '← → to flip pages']]);
  },
});
</script></body></html>

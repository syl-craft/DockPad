name: Build Velopack packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Checkout Mue
        uses: actions/checkout@v4
        with:
          repository: syl-craft/Mue
          ref: v0.2.0
          path: .mue-source
      - name: Pack Mue
        shell: pwsh
        run: |
          $feed = Join-Path $env:RUNNER_TEMP 'mue-feed'
          ./.mue-source/pack.ps1 -Feed $feed -SkipTests
          "MueFeed=$feed" >> $env:GITHUB_ENV
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.mue-source') -Recurse -Force
      - name: Test
        run: dotnet test DockPad.Tests/DockPad.Tests.csproj -c Release -m:4 "-p:MueFeed=$env:MueFeed"
      - name: Test (fenetre WPF)
        run: dotnet test DockPad.Tests.Wpf/DockPad.Tests.Wpf.csproj -c Release -m:4 "-p:MueFeed=$env:MueFeed"
      - name: Build adapted native tools
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$vs/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          rustup toolchain install 1.98.1 --profile minimal
          $env:RUSTUP_TOOLCHAIN = '1.98.1'
          ./tools/velopack/build-native.ps1
      - name: Package (unsigned verification artifacts)
        run: ./tools/velopack/pack.ps1
      - name: Exercise packaged updates
        run: ./tools/velopack/test-packages.ps1
      - name: Exercise DockPad on an isolated Windows desktop
        run: ./tools/velopack/test-app.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DockPad-velopack-unsigned
          path: release/velopack/*
          if-no-files-found: error
